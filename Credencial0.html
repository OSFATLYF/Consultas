<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credencial Digital</title> 
<link rel="stylesheet" href="https://osfatlyf.org/wp-content/themes/doctio/assets/css/fontawesome.min.css?ver=5.13.0" media="all" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Rubik:400,500,600,700%7CPoppins:700,500,600&display=swap" media="all" />

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body {
    font-family: Arial, sans-serif; 
    background: #f4f4f4; 
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
    transition: background 0.3s ease;
}

/* Contenedor principal inicial (formulario de búsqueda más ancho y cómodo en móviles) */
.contenedor{
    width: 100%; 
    max-width: 550px; 
    background: #ffffff;
    padding: 30px 20px; 
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

/* Modo pantalla completa real para la credencial sin márgenes */
body.modo-credencial {
    background: #000; 
    padding: 0;
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

body.modo-credencial .contenedor {
    max-width: 100% !important;
    width: 100% !important;
    height: 100% !important;
    background: transparent !important;
    box-shadow: none !important;
    padding: 10px !important;
    margin: 0 !important;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1{
    text-align: center;
    margin-bottom: 25px;
    color: var(--azul-principal, #003775);
    font-size: 2rem;
}

.seccion{margin-top:20px;}
label{display:block;margin-bottom:10px; font-weight:bold;color:#444; font-size: 1.1rem;}

/* Input y Botón de DNI grandes y anchos para celulares */
input {
    width: 100%;
    padding: 18px 15px; 
    border: 2px solid #ccc;
    border-radius: 8px; 
    font-size: 20px; /* Letras grandes al escribir el DNI */
    text-align: center;
    letter-spacing: 1px;
}

input:focus {
    border-color: var(--azul-principal);
    outline: none;
}

:root { --azul-principal: #003775; --azul-hover: #004CA3; }

button { 
    width: 100%;
    margin-top: 15px; 
    padding: 16px; 
    background: var(--azul-principal); 
    color: white; 
    border: none; 
    border-radius: 8px;
    cursor: pointer; 
    font-weight: bold; 
    font-size: 18px; /* Botón grande y fácil de presionar */
    transition: background 0.2s ease; 
}
button:hover { background: var(--azul-hover);}
.oculto{display:none !important;}

/* Tarjeta 100% fluida adaptada al ancho disponible sin desbordarse */
.tarjeta-afiliado {
    width: 100%;
    max-width: 650px;
    aspect-ratio: 600 / 340; 
    background-size: cover;
    background-position: center;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
    margin: auto;
}   

/* En modo pantalla completa se adapta perfectamente al ancho real del dispositivo */
body.modo-credencial .tarjeta-afiliado {
    width: 100%;
    max-width: 100vw;
    max-height: 85vh;
}

.datos-tarjeta {
    position: absolute; 
    top: 48%; 
    left: 5%; 
    right: 5%; 
    color: black; 
    font-weight: bold;
}

.dato {
    font-size: clamp(0.9rem, 2.6vw, 1.4rem); /* Escala fluida y equilibrada de textos */
    margin-bottom: 2%; 
    font-family: Arial, sans-serif;
}

.error-dni {color: red; font-weight: bold; text-align: center; margin-top: 15px; font-size: 1.1rem;}

/* Botones flotantes abajo en pantalla completa */
.acciones-credencial {
    display: flex;
    gap: 15px;
    width: 90%;
    max-width: 400px;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}
.acciones-credencial button {
    font-size: 16px;
    padding: 14px;
}
</style>
</head>
<body>

    <div class="contenedor" id="contenedorPrincipal">
        <h1 id="tituloPrincipal">Credencial Digital</h1>

        <!-- Formulario de Búsqueda -->
        <div id="busquedaDiv" class="seccion">
            <label for="dni">DNI del Afiliado</label>
            <input type="tel" id="dni" placeholder="Ingrese DNI" onkeydown="detectarEnter(event)" inputmode="numeric">
            <button onclick="buscarUsuario()">Ver Credencial</button>
        </div>
     
        <!-- Visualización de la Credencial -->
        <div id="tarjetaAfiliado" class="tarjeta-afiliado oculto">
          <div class="datos-tarjeta">
              <div class="dato" id="card-nombre">-</div>
              <div class="dato">Credencial: <span id="card-credencial">-</span></div>
              <div class="dato">Plan: <span id="card-plan">-</span></div>
              <div class="dato">Estado: <span id="card-estado">-</span></div>
              <div class="dato">Delegación: <span id="card-delegacion">-</span></div>
          </div>
        </div>

        <!-- Botones de acción al mostrar la credencial -->
        <div id="accionesDiv" class="oculto acciones-credencial">
            <button onclick="reiniciarBusqueda()">Consultar Otro DNI</button>
        </div>

        <div id="mensajeBusqueda" class="error-dni"></div>
    </div>

<script>
const URL_AFILIADOS = "https://script.google.com/macros/s/AKfycbxnC103OPZbsknMUpztQYZuQbZZTzyCkzgbO6GzkFd0FcvRxk1i8fw0yyUhxDATuLcr/exec";

const URL_TARJETA_ESPECIAL = "https://raw.githubusercontent.com/OSFATLyF/Consultas/refs/heads/main/img/Especial.png";
const URL_TARJETA_BASICO = "https://raw.githubusercontent.com/OSFATLyF/Consultas/refs/heads/main/img/Basico.png";

function detectarEnter(event) {
    if (event.key === "Enter") { 
        event.preventDefault(); 
        buscarUsuario();
    }
}

async function buscarUsuario() {
    const DniInput = document.getElementById("dni");
    const dni = DniInput.value.trim();
    const msgBusqueda = document.getElementById("mensajeBusqueda");
    const tarjeta = document.getElementById("tarjetaAfiliado");
    const busquedaDiv = document.getElementById("busquedaDiv");
    const accionesDiv = document.getElementById("accionesDiv");
    const tituloPrincipal = document.getElementById("tituloPrincipal");
    const botonBuscar = document.querySelector("#busquedaDiv button");

    if (!dni) {
        msgBusqueda.style.display = "block";
        msgBusqueda.innerHTML = "Ingrese un DNI válido";
        msgBusqueda.style.color = "red";
        return;
    }

    msgBusqueda.style.display = "block"; 
    msgBusqueda.innerHTML = "Buscando credencial...";
    msgBusqueda.style.color = "var(--azul-principal)";
    botonBuscar.disabled = true; 
    botonBuscar.innerText = "Buscando...";
    tarjeta.classList.add("oculto");

    try {
        const formData = new URLSearchParams();
        formData.append("action", "buscar");
        formData.append("dni", dni);
        const respuesta = await fetch(URL_AFILIADOS, { method: "POST", body: formData });
        const datos = await respuesta.json();
     
        if (datos.existe) {
            msgBusqueda.innerHTML = ""; 
            msgBusqueda.style.display = "none";

            document.getElementById("card-nombre").innerText = datos.nombre.toUpperCase();
            document.getElementById("card-credencial").innerText = datos.credencial;
            document.getElementById("card-plan").innerText = datos.plan.toUpperCase();
            document.getElementById("card-estado").innerText = datos.estado;
            document.getElementById("card-delegacion").innerText = datos.telefono || "Salta";

            if (datos.plan.toUpperCase() === "ESPECIAL") {
                tarjeta.style.backgroundImage = `url('${URL_TARJETA_ESPECIAL}')`;
            } else {
                tarjeta.style.backgroundImage = `url('${URL_TARJETA_BASICO}')`;
            }

            document.body.classList.add("modo-credencial");
            tituloPrincipal.classList.add("oculto");
            busquedaDiv.classList.add("oculto");
            tarjeta.classList.remove("oculto");
            accionesDiv.classList.remove("oculto");
        } else {
            msgBusqueda.style.display = "block";
            msgBusqueda.innerHTML = "DNI no encontrado";
            msgBusqueda.style.color = "red";
            tarjeta.classList.add("oculto");
        }
    } catch (error) {
        console.error(error);
        msgBusqueda.style.display = "block";
        msgBusqueda.innerHTML = "Error al consultar datos";
        msgBusqueda.style.color = "red";
        tarjeta.classList.add("oculto");
    } finally {
        botonBuscar.disabled = false;
        botonBuscar.innerText = "Ver Credencial";
    }
}

function reiniciarBusqueda() {
    document.getElementById("dni").value = "";
    document.getElementById("tarjetaAfiliado").classList.add("oculto");
    document.getElementById("accionesDiv").classList.add("oculto");
    document.getElementById("busquedaDiv").classList.remove("oculto");
    document.getElementById("tituloPrincipal").classList.remove("oculto");
    document.getElementById("mensajeBusqueda").style.display = "none";
    document.body.classList.remove("modo-credencial");
}
</script>
</body>
</html>
